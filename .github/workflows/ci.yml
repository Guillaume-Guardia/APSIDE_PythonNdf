name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      # Tests calling the Google API are skipped when the secret is not set
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same commands as in local, see dev.bat
      - name: Install dependencies
        run: dev.bat install

      - name: Run tests
        run: dev.bat test
